[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "DJ001", # avoid using null=True on string-based fields (common in this project)
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "F401"]
"*/tests/*" = ["F401", "F811", "F841"]
"*/settings/*.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"

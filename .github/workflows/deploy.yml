name: Deploy

# Every push to main: lint + tests, build an image tagged with the commit,
# push it to GHCR, then deploy it to the Hetzner server over Tailscale.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling a deploy mid-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/nuwaves/retyped_processing

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: [lint, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: retyped.taila0d4b.ts.net

      # The deploy user's login shell only accepts "<backend|frontend> <sha>".
      # The job token goes over stdin so the server can pull from GHCR; it expires with the job.
      - name: Deploy
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -o StrictHostKeyChecking=accept-new \
            deploy@retyped.taila0d4b.ts.net "backend ${{ github.sha }}"

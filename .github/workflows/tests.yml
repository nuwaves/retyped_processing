name: Django Tests

on:
  push:
    branches-ignore: 
      - main
  pull_request:
    branches: 
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audio_processing
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      meilisearch:
        image: getmeili/meilisearch:v1.7
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -f http://localhost:7700/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          MEILI_MASTER_KEY: 'test767ff88c4893803599b546731d95'

    steps:
    - uses: actions/checkout@v4

    # Match the production image (Dockerfile: python:3.11)
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up environment variables
      run: |
        echo "DJANGO_SETTINGS_MODULE=audio_processing.settings.dev" >> $GITHUB_ENV
        echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/test_audio_processing" >> $GITHUB_ENV
        echo "DJANGO_SECRET_KEY=test-secret-key-for-ci" >> $GITHUB_ENV
        echo "DEBUG=False" >> $GITHUB_ENV
        echo "DB_PASSWORD=postgres" >> $GITHUB_ENV
        echo "DB_NAME=audio_processing" >> $GITHUB_ENV
        echo "MEILISEARCH_API_KEY=test767ff88c4893803599b546731d95" >> $GITHUB_ENV

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo "Waiting for postgres..."
          sleep 1
        done

    - name: Run migrations
      run: |
        python manage.py migrate --verbosity=2 --skip-checks

    - name: Run tests
      run: |
        python manage.py test --verbosity=2 --keepdb audio_processing/tests